services:
  - type: web
    name: scribble
    env: node
    buildCommand: npm ci && npm run build:client
    startCommand: node server/src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false
