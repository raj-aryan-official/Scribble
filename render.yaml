services:
  - type: web
    name: scribble
    env: node
    buildCommand: npm ci --prefix client && npm run build --prefix client && npm ci --prefix server
    startCommand: node server/src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        fromService:
          type: web
          name: scribble
          property: host
