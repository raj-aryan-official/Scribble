<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preload" href="/fonts/bricolage-grotesque-800.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin />
  <title>Scribble</title>

  <!--
    Static Open Graph and Twitter meta tags for chat app link previews (WhatsApp, Twitter/X, iMessage, Discord).
    Note: Dynamic per-room previews (e.g. customized with host name or live player count) would need server-side rendering (SSR).
  -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Join a Scribble room" />
  <meta property="og:description" content="Draw it. Guess it. Win bragging rights. Join a live multiplayer drawing game on Scribble!" />
  <meta property="og:image" content="/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Join a Scribble room" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Join a Scribble room" />
  <meta name="twitter:description" content="Draw it. Guess it. Win bragging rights. Join a live multiplayer drawing game on Scribble!" />
  <meta name="twitter:image" content="/og-image.png" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
