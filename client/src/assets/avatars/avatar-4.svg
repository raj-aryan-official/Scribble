<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Owl Face with Spectacles -->
  <circle cx="24" cy="25" r="17" fill="#2F4FD8" stroke="#1C1B18" stroke-width="2" />
  <!-- Ear Tufts -->
  <polygon points="12,14 10,6 18,10" fill="#2F4FD8" stroke="#1C1B18" stroke-width="2" stroke-linejoin="round" />
  <polygon points="36,14 38,6 30,10" fill="#2F4FD8" stroke="#1C1B18" stroke-width="2" stroke-linejoin="round" />
  <!-- Glasses / Eyes -->
  <circle cx="17" cy="24" r="7" fill="#FBF6EA" stroke="#1C1B18" stroke-width="2" />
  <circle cx="31" cy="24" r="7" fill="#FBF6EA" stroke="#1C1B18" stroke-width="2" />
  <line x1="24" y1="24" x2="24" y2="24" stroke="#1C1B18" stroke-width="2" />
  <circle cx="17" cy="24" r="3" fill="#1C1B18" />
  <circle cx="31" cy="24" r="3" fill="#1C1B18" />
  <!-- Beak -->
